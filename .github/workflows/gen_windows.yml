name: windows

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/*.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/config.toml"
      - ".github/workflows/gen_windows.yml"
      - "assets/fonts/**/*"
      - "assets/icon/*"
      - "assets/windows/**/*"
      - "ci/deploy.sh"
      - "ci/windows-installer.iss"
      - "ci/windows-openssl-cache.ps1"

jobs:
  build:
    runs-on: "windows-2025"
    
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v5.0.5
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config.toml
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}"
      - name: "Vendor dependecies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config.toml"
      - name: "Fingerprint static OpenSSL cache inputs"
        id: openssl-cache-context
        shell: pwsh
        run: "./ci/windows-openssl-cache.ps1 key"
      - name: "Restore static OpenSSL"
        uses: actions/cache/restore@v5.0.5
        id: cache-openssl
        with:
          path: "target/ci-cache/openssl/x86_64-pc-windows-msvc"
          key: "windows-openssl-msvc-static-v3-${{ steps.openssl-cache-context.outputs.key }}-restore"
          restore-keys: "windows-openssl-msvc-static-v3-${{ steps.openssl-cache-context.outputs.key }}-"
      - name: "Activate cached static OpenSSL"
        id: openssl-cache-activate
        env:
          OPENSSL_CACHE_KEY: ${{ steps.openssl-cache-context.outputs.key }}
        shell: pwsh
        run: "./ci/windows-openssl-cache.ps1 activate"
      - name: "Reset release sccache statistics"
        shell: cmd
        run: "sccache --zero-stats"
      - name: "Build wezterm (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm --release
      - name: "Build wezterm-gui (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm-gui --release
      - name: "Build wezterm-mux-server (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm-mux-server --release
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p strip-ansi-escapes --release
      - name: "Report release sccache statistics"
        shell: cmd
        run: "sccache --show-stats"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "windows"
      - name: "Test"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo nextest run --all --no-fail-fast
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "windows"
          path: |
            WezTerm-*.zip
            WezTerm-*.exe
