name: windows_openssl_cache
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
  push:
    branches:
      - main
      - dev
    paths:
      - "**/Cargo.toml"
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "ci/generate-workflows.py"
      - "ci/generate_workflows_target_core.py"
      - "ci/windows-openssl-cache.ps1"
permissions:
  contents: read
jobs:
  build:
    runs-on: "windows-2025"
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v5.0.5
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config.toml
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}"
      - name: "Vendor dependecies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config.toml"
      - name: "Fingerprint static OpenSSL cache inputs"
        id: openssl-cache-context
        shell: pwsh
        run: "./ci/windows-openssl-cache.ps1 key"
      - name: "Restore static OpenSSL"
        uses: actions/cache/restore@v5.0.5
        id: cache-openssl
        with:
          path: "target/ci-cache/openssl/x86_64-pc-windows-msvc"
          key: "windows-openssl-msvc-static-v3-${{ steps.openssl-cache-context.outputs.key }}-restore"
          restore-keys: "windows-openssl-msvc-static-v3-${{ steps.openssl-cache-context.outputs.key }}-"
      - name: "Activate cached static OpenSSL"
        id: openssl-cache-activate
        env:
          OPENSSL_CACHE_KEY: ${{ steps.openssl-cache-context.outputs.key }}
        shell: pwsh
        run: "./ci/windows-openssl-cache.ps1 activate"
      - name: "Build async_ossl to warm static OpenSSL cache"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p async_ossl --release
      - name: "Populate static OpenSSL cache"
        env:
          OPENSSL_CACHE_KEY: ${{ steps.openssl-cache-context.outputs.key }}
        shell: pwsh
        run: "./ci/windows-openssl-cache.ps1 populate"
      - name: "Save static OpenSSL cache"
        uses: actions/cache/save@v5.0.5
        if: steps.openssl-cache-activate.outputs.active != 'true'
        with:
          path: "target/ci-cache/openssl/x86_64-pc-windows-msvc"
          key: "windows-openssl-msvc-static-v3-${{ steps.openssl-cache-context.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}"
